[package]
name = "traversal-arena"
version = "0.1.0"
edition = "2021"
publish = false
description = "Arène des bots Traversal : exécute des bots WebAssembly en bac à sable (wasmtime, fuel)."

[[bin]]
name = "traversal-arena"
path = "src/main.rs"

[dependencies]
traversal-core = { path = "../core" }
# Branche LTS de wasmtime (correctifs de sécurité pendant 2 ans) : `cargo update -p wasmtime`
# suffit à prendre le dernier correctif. Vérifier avec `make arena-audit SITE=traversal`.
wasmtime = { version = "36.0.19", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
serde_json = "1.0.133"
sha2 = "0.10.8"
ureq = { version = "2.12.1", features = ["json"] }

# Cloisonnement de chaque partie dans un processus enfant (Linux : seccomp + setrlimit).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.169"
seccompiler = "0.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
